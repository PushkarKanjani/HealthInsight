# Trino Iceberg Catalog Configuration
# File location: $TRINO_HOME/etc/catalog/iceberg.properties
#
# IMPORTANT: Copy this file to your Trino installation's etc/catalog/ directory.
# Verify property names against your installed Trino version:
# https://trino.io/docs/current/connector/iceberg.html
#
# Update the warehouse path to match your ICEBERG_WAREHOUSE in .env

connector.name=iceberg
iceberg.catalog.type=hadoop
iceberg.catalog.warehouse=/absolute/path/to/HealthInsight/iceberg/warehouse

# Optional: enable statistics collection
iceberg.table-statistics-enabled=true
