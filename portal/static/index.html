<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthInsight — Clinical AI Command Center</title>
  <meta name="description" content="Secure access to HealthInsight Clinical AI Command Center. Query 10M+ patient records with natural language powered by Gemini and Apache Trino." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css" />

  <style>
    /* Login-specific overrides */
    .login-logo-ring {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.14), 0 4px 10px rgba(0,0,0,0.08);
    }
    .login-logo-ring svg { width: 36px; height: 36px; fill: white; }

    .stack-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .stack-badge {
      padding: 3px 9px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: var(--r-pill);
      background: rgba(0,0,0,0.04);
      color: var(--text-tertiary);
      border: 1px solid rgba(0,0,0,0.06);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .login-footer {
      text-align: center;
      font-size: var(--t-caption);
      color: var(--text-tertiary);
    }
    .login-footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }
    .login-footer a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-tertiary);
      font-size: var(--t-caption);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0,0,0,0.07);
    }
  </style>
</head>
<body>

  <!-- Pastel mesh background -->
  <canvas id="webgl-canvas" aria-hidden="true"></canvas>

  <!-- Hidden SVG filter library -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-refract" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.008" numOctaves="3" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- Custom cursor -->
  <div id="cursor-dot"  aria-hidden="true"></div>
  <div id="cursor-blob" aria-hidden="true"></div>

  <!-- App container -->
  <div class="app-container">
    <main class="login-wrapper">
      <div class="login-card glass-panel glass-heavy glass-refract">

        <!-- Header -->
        <div class="login-header">
          <div class="login-logo-ring">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
          </div>

          <h1 class="login-title">HealthInsight</h1>
          <p class="login-desc">Clinical AI Command Center<br>on a Big Data Lakehouse</p>

          <div class="stack-badges">
            <span class="stack-badge">Trino 435</span>
            <span class="stack-badge">Iceberg 1.5</span>
            <span class="stack-badge">Gemini AI</span>
            <span class="stack-badge">MongoDB 7</span>
          </div>
        </div>

        <!-- Form -->
        <form class="login-form" id="login-form" novalidate autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="username-input">Username</label>
            <input
              class="form-input"
              id="username-input"
              type="text"
              placeholder="e.g. admin"
              autocomplete="username"
              spellcheck="false"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password-input">Password</label>
            <input
              class="form-input"
              id="password-input"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>

          <!-- Error banner -->
          <div id="login-error" class="error-banner" role="alert" aria-live="polite"></div>

          <button class="btn-primary" id="login-btn" type="submit" style="width:100%;padding:13px;font-size:0.975rem;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M11 17l-5-5 1.41-1.41L11 14.17l7.59-7.59L20 8l-9 9z"/>
            </svg>
            Sign In
          </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
          <p>Demo credentials: <strong>admin / healthinsight2024</strong></p>
          <p style="margin-top:6px;">
            Big Data Analytics Project ·
            <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
          </p>
        </div>

      </div><!-- /login-card -->
    </main>
  </div><!-- /app-container -->

  <!-- JS -->
  <!-- NOTE: Three.js CDN removed — background is now pure Canvas 2D -->
  <script src="/static/three-scene.js" defer></script>
  <script src="/static/cursor.js" defer></script>
  <script src="/static/motion.js" defer></script>
  <script src="/static/auth.js" defer></script>
</body>
</html>
