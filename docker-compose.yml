services:
  # ── v1 Lakehouse Infrastructure ─────────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: healthinsight-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthinsight
    volumes:
      - mongo_data:/data/db

  trino:
    image: trinodb/trino:435
    container_name: healthinsight-trino
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./iceberg/warehouse:/warehouse
    environment:
      - TRINO_ENVIRONMENT=production

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: healthinsight-superset:latest
    container_name: healthinsight-superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=healthinsight_secret_key_bda_2026_salt
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      - trino

  # ── v2 AI Clinical Command Center ───────────────────────────────────────────
  # NOTE: The portal runs on the HOST (not Docker) to share Python venv.
  # Start manually: python -m uvicorn portal.server:app --port 5000 --reload
  #
  # Uncomment the block below ONLY if you want to Dockerize the portal later:
  #
  # portal:
  #   build:
  #     context: ./portal
  #     dockerfile: Dockerfile
  #   container_name: healthinsight-portal
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   env_file: .env
  #   depends_on:
  #     - trino
  #     - mongodb

volumes:
  mongo_data:
  superset_home:
